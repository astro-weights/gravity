name: Bug report
description: Something in gravity does not work as expected.
type: Bug
labels: [bug, needs triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Smallest command or request that shows the problem (llama-server flags, request body, model and adapter files).
      render: shell
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: gravity commit (`git rev-parse --short HEAD`), OS, backend (CPU, CUDA, Metal), GPU, and the cmake flags you built with.
    validations:
      required: true
  - type: dropdown
    id: upstream
    attributes:
      label: Does it also happen on upstream llama.cpp at the base tag (UPSTREAM.md)?
      options:
        - Not checked
        - "Yes"
        - "No"
    validations:
      required: true
