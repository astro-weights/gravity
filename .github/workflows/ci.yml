name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Budget (private repo, GitHub Free): hosted Linux only, about 1,200 min/month across all workflows. No hosted macOS.
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ccache build-essential libssl-dev python3-pip
          PIP_BREAK_SYSTEM_PACKAGES=1 pip3 install -q ./gguf-py jinja2==3.1.6
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-
      - name: Build
        run: |
          cmake -B build -DGGML_NATIVE=OFF -DLLAMA_FATAL_WARNINGS=ON -DGGML_RPC=ON
          cmake --build build --config Release -j "$(nproc)"
          ccache -s
      - if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}
      - name: Upstream tests
        working-directory: build
        run: ctest -L main --output-on-failure --timeout 900

  # Self-hosted runner on the maintainer's Mac (Apple M3 Pro). Skipped until the repo variable MAC_RUNNER is "on".
  # Rework before this repo goes public (0.3): pull requests from outside must never run on this machine.
  macos:
    if: vars.MAC_RUNNER == 'on'
    runs-on: [self-hosted, macOS, ARM64, gravity-m3]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build (Metal)
        run: |
          cmake -B build -DGGML_NATIVE=OFF -DLLAMA_FATAL_WARNINGS=ON -DGGML_METAL=ON -DGGML_RPC=ON
          cmake --build build --config Release -j "$(sysctl -n hw.ncpu)"
      - name: Upstream tests
        working-directory: build
        run: ctest -L main --output-on-failure --timeout 900

  # Advisory while private (GitHub Free has no rulesets for private repos): every commit after the base needs git commit -s.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          bad=0
          while IFS=$'\t' read -r sha author; do
            git log -1 --format=%B "$sha" | grep -qiF "Signed-off-by: $author" \
              || { echo "::error::$sha has no 'Signed-off-by: $author' (git commit -s)"; bad=1; }
          done < <(git log --no-merges --format='%H%x09%an <%ae>' "$BASE_SHA..HEAD")
          exit "$bad"
