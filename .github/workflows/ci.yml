name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Budget (private repo, GitHub Free): hosted Linux about 1,200 min/month; hosted macOS only on release tags (macos.yml). No self-hosted runners.
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ccache build-essential libssl-dev python3-pip
          PIP_BREAK_SYSTEM_PACKAGES=1 pip3 install -q ./gguf-py jinja2==3.1.6
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-
      - name: Build
        run: |
          cmake -B build -DGGML_NATIVE=OFF -DLLAMA_FATAL_WARNINGS=ON -DGGML_RPC=ON -DLLAMA_USE_PREBUILT_UI=OFF
          cmake --build build --config Release -j "$(nproc)"
          ccache -s
      - if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}
      - name: Upstream tests
        working-directory: build
        run: ctest -L main --output-on-failure --timeout 900
      # Server tests (tools/server/tests fast suite, small HF models) only when the server or this workflow changed: about 5 min.
      - name: Server changed?
        id: server
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          run=true
          if [ "${GITHUB_EVENT_NAME}" != workflow_dispatch ] && [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
            files=$(gh api "repos/$REPO/compare/$BASE...$HEAD" --jq '.files[].filename')
            grep -qE '^(tools/server/|\.github/workflows/ci\.yml$)' <<<"$files" || run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.server.outputs.run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/server/tests/tmp
          key: server-models-${{ hashFiles('tools/server/tests/**/*.py') }}
          restore-keys: server-models-
      - name: Server tests
        if: steps.server.outputs.run == 'true'
        working-directory: tools/server/tests
        # Same as tests.sh (fast suite). test_no_ui needs the embedded web UI, which CI builds leave out.
        run: |
          PIP_BREAK_SYSTEM_PACKAGES=1 pip3 install -q -r requirements.txt
          python3 -m pytest --durations=30 -v -x -n 4 --dist=worksteal -m "not slow" --deselect unit/test_basic.py::test_no_ui
      - if: steps.server.outputs.run == 'true' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/server/tests/tmp
          key: server-models-${{ hashFiles('tools/server/tests/**/*.py') }}

  # Advisory while private (GitHub Free has no rulesets for private repos): every commit after the base needs git commit -s.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          bad=0
          while IFS=$'\t' read -r sha author; do
            git log -1 --format=%B "$sha" | grep -qiF "Signed-off-by: $author" \
              || { echo "::error::$sha has no 'Signed-off-by: $author' (git commit -s)"; bad=1; }
          done < <(git log --no-merges --format='%H%x09%an <%ae>' "$BASE_SHA..HEAD")
          exit "$bad"
